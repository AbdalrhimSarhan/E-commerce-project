services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required in .env}
    ports:
      # Published on the host as DB_PORT (5433 avoids clashing with a local Postgres)
      # so migrations, psql and `npm run start:dev` can run from the host.
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the database host is the service name.
      DB_HOST: db
      DB_PORT: 5432
      NODE_ENV: production
      PORT: 3000
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Tests in a container: `docker compose --profile test run --rm e2e`
  # Uses its own database (product_management_test) on the same Postgres.
  e2e:
    profiles: ['test']
    build:
      context: .
      target: test
    env_file: .env.test
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # MCP server for AI agents: a pure HTTP client of the API (no DB access, no secret).
  # The MCP client sends the agent API key on every request; it is passed through.
  mcp:
    build:
      context: ./mcp-server
      target: runtime
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:3000/api
      MCP_PORT: 3001
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-10000}
    ports:
      - '${MCP_PORT:-3001}:3001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MCP e2e against the running stack: `docker compose --profile test run --rm mcp-e2e`
  mcp-e2e:
    profiles: ['test']
    build:
      context: ./mcp-server
      target: test
    environment:
      MCP_URL: http://mcp:3001/mcp
      API_URL: http://api:3000/api
      AGENT_API_KEY: ${SEED_AGENT_API_KEY}
      ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD}
    depends_on:
      mcp:
        condition: service_healthy

volumes:
  pgdata:
